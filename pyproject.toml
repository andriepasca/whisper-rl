[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper_env"
version = "0.1.0"
authors = [
  { name="AndriePasca", email="andriepasca@gmail.com" },
]
description = "Offshore Maintenance Environment"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "pandas",
    "xarray",
    "scipy",
    "matplotlib",
    "gymnasium",
    "py_wake"
]
